<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero de equipo y medicación</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--sub:#fafafa;--tx:#242424;--mut:#616161;--line:#e0e0e0;--stroke:#d1d1d1;--acc:#0f6cbd;--btn:#0f6cbd;--btnh:#115ea3;--acc2:#ebf3fc;--bar:#0f6cbd;--ok:#107c10;--warn:#bc4b09;--bad:#c50f1f;--on:#fff;--hover:#f0f0f0;
 --sh2:0 0 2px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.14);--sh4:0 0 2px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.14);--sh28:0 0 8px rgba(0,0,0,.12),0 14px 28px rgba(0,0,0,.24)}
@media (prefers-color-scheme:dark){:root{--bg:#1f1f1f;--card:#292929;--sub:#242424;--tx:#fff;--mut:#adadad;--line:#3d3d3d;--stroke:#616161;--acc:#479ef5;--btn:#115ea3;--btnh:#0f6cbd;--acc2:#082338;--bar:#0c3b5e;--ok:#54b054;--warn:#faa06b;--bad:#f1707b;--hover:#333;
 --sh2:0 0 2px rgba(0,0,0,.24),0 1px 2px rgba(0,0,0,.28);--sh4:0 0 2px rgba(0,0,0,.24),0 2px 4px rgba(0,0,0,.28);--sh28:0 0 8px rgba(0,0,0,.24),0 14px 28px rgba(0,0,0,.48)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/20px "Segoe UI Variable Text","Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bar);color:#fff}
header h1{font-size:16px;line-height:22px;font-weight:600;margin:0}

header small{color:rgba(255,255,255,.85);display:block;font-weight:400;font-size:12px;line-height:16px}
header button,header button.pel{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
header button:hover,header button.pel:hover{background:rgba(255,255,255,.16);border-color:#fff}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px;background:var(--card);box-shadow:var(--sh2);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;color:var(--mut);padding:12px 12px;border-radius:0;white-space:nowrap;font-weight:400;min-height:44px;position:relative}
nav button:hover{background:none;color:var(--tx)}
nav button:hover::after,nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--stroke)}
nav button.on{color:var(--tx);font-weight:600}
nav button.on::after{background:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--stroke);background:var(--card);border-radius:4px;padding:5px 12px;min-height:32px;font-weight:600;transition:background .1s,border-color .1s}
button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--btn);border-color:var(--btn);color:var(--on)}
button.pri:hover{background:var(--btnh);border-color:var(--btnh)}
button.min{padding:1px 8px;min-height:24px;font-size:12px;font-weight:400}
button.pel{color:var(--bad)}
input,select,textarea{border:1px solid var(--stroke);border-bottom-color:var(--mut);background:var(--card);border-radius:4px;padding:5px 8px;min-height:32px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-bottom:2px solid var(--acc);padding-bottom:4px}
input[type=checkbox]{min-height:0;width:16px;height:16px;accent-color:var(--btn)}
.card{background:var(--card);border-radius:8px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--sh2)}
.card h2{font-size:16px;line-height:22px;font-weight:600;margin:0}
.sh{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}
.mut{color:var(--mut);font-size:12px;line-height:16px;margin:4px 0 10px}
.aviso{background:var(--acc2);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);border-radius:4px;padding:10px 14px;margin-bottom:16px}
.filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.filtros label{display:flex;flex-direction:column;font-size:12px;line-height:16px;color:var(--mut);gap:4px}
.filtros label input,.filtros label select{font-size:14px;color:var(--tx)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border-radius:8px;padding:14px 16px;box-shadow:var(--sh2);transition:box-shadow .15s}
.tile:hover{box-shadow:var(--sh4)}
.tile b{display:block;font-size:32px;line-height:40px;font-weight:600;margin:4px 0 0}
.tile span{font-size:14px;font-weight:600}
.tile small{display:block;color:var(--mut);font-size:12px;line-height:16px}
.tile em{display:block;font-style:normal;font-size:12px;line-height:16px;color:var(--mut);border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mut);font-weight:600}
tbody tr:hover{background:var(--sub)}
td.wrap{white-space:normal;min-width:180px}
td.acc{text-align:right}
svg{width:100%;height:auto;display:block}
.sv{font-size:11px;fill:var(--tx)}.sl{font-size:10px;fill:var(--mut)}
.h{border:1px solid var(--line);border-left:4px solid var(--stroke);padding:10px 14px;margin:8px 0;background:var(--sub);border-radius:4px}
.h.alta{border-left-color:var(--bad)}.h.media{border-left-color:var(--warn)}.h.baja{border-left-color:var(--acc)}
.h strong{display:block;font-weight:600}.h p{margin:4px 0}
.tag{display:inline-block;font-size:11px;line-height:16px;font-weight:600;margin-right:8px;padding:0 6px;border-radius:4px;border:1px solid currentColor;vertical-align:1px}
.tag.alta{color:var(--bad)}.tag.media{color:var(--warn)}.tag.baja{color:var(--acc)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
dialog{border:0;border-radius:8px;background:var(--card);color:var(--tx);padding:24px;width:min(520px,calc(100vw - 32px));max-height:90vh;overflow:auto;box-shadow:var(--sh28)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 16px;font-size:20px;line-height:26px;font-weight:600}
dialog label{display:block;font-size:14px;margin-bottom:12px}
dialog label input:not([type=checkbox]),dialog label select,dialog label textarea{display:block;width:100%;margin-top:4px}
dialog label.chk{display:flex;gap:8px;align-items:center}
.acc2{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
#faj label{font-size:14px}#faj input{margin-top:4px}
textarea.pr{width:100%;min-height:260px;font:13px/1.45 "Cascadia Code",Consolas,ui-monospace,Menlo,monospace}
/* Gráficos y resumen gerencial */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--track:#cde2fb;--good:#0ca30c;--warnc:#fab219;--crit:#d03b3b;--grid:#e6e6e6;--axis:#c7c7c7}
@media (prefers-color-scheme:dark){:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--track:#104281;--grid:#383838;--axis:#525252}}
.hero{display:grid;grid-template-columns:minmax(200px,250px) 1fr;gap:16px 32px;align-items:start}
.hero .n{font-size:64px;line-height:72px;font-weight:600}
.lbl{font-size:14px;font-weight:600;display:block}
.res h3{font-size:14px;line-height:20px;margin:14px 0 4px;font-weight:600}
.res h3:first-child{margin-top:0}
.res p,.res li{margin:0 0 4px}
.res ul{margin:0;padding-left:18px}
.delta{font-size:12px;line-height:16px;display:block;margin-top:2px;color:var(--mut)}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.st i{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:11px;line-height:1;font-weight:700;color:#fff;flex:none}
.st{color:var(--tx)}.st.e-good i{background:var(--good)}.st.e-warn i{background:var(--warnc);color:#0b0b0b}.st.e-crit i{background:var(--crit)}.st.e-nd i{background:var(--axis)}
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;line-height:16px;color:var(--mut);margin:8px 0}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:2px;flex:none}.leg i.ln{height:2px;width:14px;border-radius:1px}
.hb{display:grid;gap:8px;margin-top:10px}
.hbr{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:4px 12px;align-items:center;border-radius:4px;padding:3px 6px;margin:0 -6px}
.hbr:hover,.hbr:focus{background:var(--sub);outline:none}
.hbr:focus-visible{outline:2px solid var(--acc)}
.hbt{height:12px;position:relative}
.hbt b{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.hbt.m{background:var(--track);border-radius:6px}.hbt.m b{border-radius:6px}
.hbt.m u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tx)}
.hbv{font-size:13px;font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center;justify-content:flex-end;color:var(--mut)}
.hbv strong{font-weight:600;min-width:40px;text-align:right;color:var(--tx)}
details.tv{margin-top:12px;font-size:12px}details.tv summary{cursor:pointer;color:var(--mut)}details.tv table{font-size:12px;margin-top:6px}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:4px;box-shadow:var(--sh4);padding:8px 10px;font-size:12px;line-height:16px;max-width:260px;display:none}
#tip .tt{color:var(--mut);margin-bottom:2px}#tip .tr{display:flex;gap:6px;align-items:center}#tip .tr i{width:10px;height:2px;border-radius:1px;flex:none}#tip .tr b{font-weight:600}
svg .hit{outline:none}svg .hit rect{fill:transparent}
svg .hit.col:hover rect,svg .hit.col:focus rect{fill:var(--tx);fill-opacity:.06}
svg .cross{stroke:var(--mut);stroke-width:1;opacity:0}svg .hit:hover .cross,svg .hit:focus .cross{opacity:1}
.gl{stroke:var(--grid);stroke-width:1}.bl{stroke:var(--axis);stroke-width:1}
@media(max-width:700px){.hero{grid-template-columns:1fr}}
@media(max-width:560px){.hbr{grid-template-columns:1fr auto}.hbn{grid-column:1/-1}}
@media print{:root{--bg:#fff;--card:#fff;--sub:#fafafa;--tx:#242424;--mut:#616161;--line:#e0e0e0;--stroke:#d1d1d1;--acc:#0f6cbd;--acc2:#ebf3fc;--bar:#fff;--ok:#107c10;--warn:#bc4b09;--bad:#c50f1f;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--track:#cde2fb;--grid:#e6e6e6;--axis:#c7c7c7;--sh2:none;--sh4:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 header{color:#242424;border-bottom:1px solid #e0e0e0}header small{color:#616161}
 header div,nav,.noprint,.aviso,details.tv,#tip{display:none!important}
 main{max-width:none;padding:12px 0}.card,.tile{border:1px solid #e0e0e0;break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1><span id="org"></span><small>Tablero de equipo, recursos y medicación · los datos se guardan solo en este navegador</small></h1>
  <div>
    <button data-act="exportar">Exportar respaldo</button>
    <button data-act="importar">Importar</button>
    <button data-act="demo">Cargar datos de ejemplo</button>
    <button class="pel" data-act="vaciar">Empezar en blanco</button>
    <input type="file" id="arch" accept="application/json,.json" hidden>
  </div>
</header>
<nav id="nav"></nav>
<main id="vista"></main>
<dialog id="dlg"></dialog>
<div id="tip" role="tooltip"></div>
<script>
'use strict';
/* ============ Utilidades ============ */
const KEY='tablero-equipo-v1';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'r'+Date.now()+Math.random().toString(36).slice(2));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const HOY=iso(new Date());
const D=s=>new Date(s+'T12:00:00');
const addDias=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const difDias=(a,b)=>Math.round((D(b)-D(a))/864e5);
const fmt=s=>s?s.split('-').reverse().join('/'):'—';
const lunes=s=>addDias(s,-((D(s).getDay()+6)%7));
const iniMes=s=>s.slice(0,8)+'01';
const finMes=s=>{const d=D(iniMes(s));d.setMonth(d.getMonth()+1);d.setDate(0);return iso(d)};
const pct=(n,d)=>d?Math.round(n/d*100):null;
const verPct=p=>p===null?'—':p+'%';
const num=v=>(+v||0).toLocaleString('es');

/* ============ Modelo de datos ============ */
const COLS=['integrantes','cursos','actividades','tareas','incidentes','horas','equipos','insumos','capital','pacientes','indicaciones','administraciones'];
const TIPOS_EV=['Casi accidente','Primeros auxilios','Tratamiento médico','Con días perdidos','Daño material','Ambiental'],REG=['Tratamiento médico','Con días perdidos'];
const METAS={acciones:90,tareas:90,seguimiento:90,calidad:90,capacitacion:95,equipos:90,adherencia:90};
const A=()=>db.ajustes;
const S={
 integrantes:{titulo:'Integrantes',uno:'integrante',campos:[
  {k:'codigo',l:'Código o alias (evitar nombre completo)',c:'Código',t:'text',req:1},
  {k:'rol',l:'Rol',t:'select',o:()=>A().roles},{k:'turno',l:'Turno',t:'select',o:()=>A().turnos},
  {k:'equipo',l:'Equipo / cuadrilla / base',c:'Equipo',t:'text'},{k:'activo',l:'Activo',t:'check',d:true}]},
 cursos:{titulo:'Capacitaciones y habilitaciones',uno:'capacitación',campos:[
  {k:'integrante',l:'Integrante',t:'ref',col:'integrantes',req:1},{k:'curso',l:'Curso o habilitación',c:'Curso',t:'text',req:1},
  {k:'vence',l:'Vence',t:'date',req:1}]},
 actividades:{titulo:'Actividades',uno:'actividad',campos:[
  {k:'fecha',l:'Fecha',t:'date',req:1,d:HOY},{k:'tipo',l:'Tipo',t:'select',o:()=>A().tipos},
  {k:'integrante',l:'Integrante',t:'ref',col:'integrantes',req:1},{k:'turno',l:'Turno',t:'select',o:()=>A().turnos},
  {k:'reqSeg',l:'Requiere seguimiento',c:'Req. seguim.',t:'check'},{k:'segDoc',l:'Seguimiento documentado',c:'Seguim. doc.',t:'check'},
  {k:'completo',l:'Registro completo',c:'Reg. completo',t:'check',d:true},{k:'nota',l:'Nota (sin datos personales)',c:'Nota',t:'text'}]},
 tareas:{titulo:'Tareas',uno:'tarea',campos:[
  {k:'titulo',l:'Tarea',t:'text',req:1},{k:'integrante',l:'Asignada a',t:'ref',col:'integrantes',req:1},
  {k:'asignada',l:'Fecha de asignación',c:'Asignada',t:'date',d:HOY},{k:'vence',l:'Plazo',t:'date',req:1},
  {k:'completada',l:'Fecha de finalización (vacío = pendiente)',c:'Completada',t:'date'}]},
 equipos:{titulo:'Equipamiento',uno:'equipo',campos:[
  {k:'nombre',l:'Equipo',t:'text',req:1},{k:'tipo',l:'Tipo',t:'text'},
  {k:'estado',l:'Estado',t:'select',o:()=>['Operativo','En mantenimiento','Fuera de servicio']},
  {k:'calibVence',l:'Vence calibración / mantenimiento',c:'Vence calibración',t:'date'},{k:'ubicacion',l:'Ubicación',t:'text'}]},
 insumos:{titulo:'Insumos y medicamentos en stock',uno:'insumo',campos:[
  {k:'nombre',l:'Insumo',t:'text',req:1},{k:'categoria',l:'Categoría',t:'text'},
  {k:'stock',l:'Stock actual',c:'Stock',t:'num'},{k:'minimo',l:'Stock mínimo',c:'Mínimo',t:'num'},
  {k:'unidad',l:'Unidad',t:'text'},{k:'vence',l:'Vencimiento',t:'date'}]},
 capital:{titulo:'Capital y presupuesto',uno:'rubro',campos:[
  {k:'rubro',l:'Rubro',t:'text',req:1},{k:'periodo',l:'Mes',t:'month',req:1,d:HOY.slice(0,7)},
  {k:'presupuestado',l:'Presupuestado',t:'num'},{k:'ejecutado',l:'Ejecutado',t:'num'}]},
 pacientes:{titulo:'Pacientes',uno:'paciente',campos:[
  {k:'codigo',l:'Código (nunca nombre ni documento)',c:'Código',t:'text',req:1},{k:'sector',l:'Sector / base',c:'Sector',t:'text'},
  {k:'alergias',l:'Alergias registradas (separadas por coma)',c:'Alergias',t:'text'},{k:'activo',l:'Activo',t:'check',d:true}]},
 indicaciones:{titulo:'Indicaciones de medicación',uno:'indicación',campos:[
  {k:'paciente',l:'Paciente',t:'ref',col:'pacientes',req:1},{k:'medicamento',l:'Medicamento',t:'text',req:1},
  {k:'dosis',l:'Dosis (ej. 500 mg)',c:'Dosis',t:'text'},{k:'via',l:'Vía',t:'select',o:()=>['Oral','Intramuscular','Endovenosa','Subcutánea','Tópica','Inhalatoria','Otra']},
  {k:'dosisDia',l:'Dosis por día (0 = a demanda)',c:'Dosis/día',t:'num',d:1},
  {k:'inicio',l:'Inicio',t:'date',req:1,d:HOY},{k:'fin',l:'Fin (vacío = crónica)',c:'Fin',t:'date'},
  {k:'prescriptor',l:'Prescriptor (código o matrícula)',c:'Prescriptor',t:'text'},{k:'controlado',l:'Medicamento controlado',c:'Controlado',t:'check'}]},
 administraciones:{titulo:'Registro de administración',uno:'administración',campos:[
  {k:'fecha',l:'Fecha',t:'date',req:1,d:HOY},{k:'hora',l:'Hora',t:'time'},
  {k:'indicacion',l:'Indicación',t:'ref',col:'indicaciones',req:1},
  {k:'estado',l:'Estado',t:'select',o:()=>['Administrada','Demorada','Omitida','Rechazada']},
  {k:'motivo',l:'Motivo / observación',c:'Motivo',t:'text'},{k:'registradoPor',l:'Registrado por',t:'ref',col:'integrantes'}]},
 incidentes:{titulo:'Eventos HSE',uno:'evento',campos:[
  {k:'fecha',l:'Fecha',t:'date',req:1,d:HOY},{k:'tipo',l:'Tipo de evento',c:'Tipo',t:'select',o:()=>TIPOS_EV},
  {k:'area',l:'Área o sector',c:'Área',t:'text'},{k:'turno',l:'Turno',t:'select',o:()=>A().turnos},
  {k:'diasPerdidos',l:'Días perdidos',t:'num'},{k:'descripcion',l:'Descripción breve (sin nombres)',c:'Descripción',t:'text'},
  {k:'accion',l:'Acción correctiva',t:'text'},{k:'accionVence',l:'Plazo de la acción',c:'Plazo acción',t:'date'},
  {k:'accionCerrada',l:'Fecha de cierre de la acción (vacío = abierta)',c:'Acción cerrada',t:'date'}]},
 horas:{titulo:'Horas trabajadas',uno:'mes de horas trabajadas',campos:[
  {k:'periodo',l:'Mes',t:'month',req:1,d:HOY.slice(0,7)},{k:'horas',l:'Horas trabajadas por todo el personal del sitio',c:'Horas trabajadas',t:'num',req:1}]}
};
function vacio(){const d={ajustes:{org:'Mi equipo',turnos:['Día','Noche'],roles:['Enfermería','Medicina','Paramédico','Seguridad e higiene','Supervisión'],tipos:['Control','Atención','Inspección','Capacitación'],base:1000000,metas:{...METAS}}};COLS.forEach(c=>d[c]=[]);return d}
function normal(r){if(!r||typeof r!=='object'||!r.ajustes)return null;const b=vacio();['turnos','roles','tipos'].forEach(k=>{if(!Array.isArray(r.ajustes[k])||!r.ajustes[k].length)r.ajustes[k]=b.ajustes[k]});r.ajustes.base=r.ajustes.base===200000?200000:1000000;const m=r.ajustes.metas||{};r.ajustes.metas={};Object.keys(METAS).forEach(k=>{const v=+m[k];r.ajustes.metas[k]=m[k]!=null&&isFinite(v)?Math.max(0,Math.min(100,v)):METAS[k]});COLS.forEach(c=>{r[c]=Array.isArray(r[c])?r[c].filter(x=>x&&typeof x==='object'&&x.id):[]});return r}
function cargar(){try{const r=normal(JSON.parse(localStorage.getItem(KEY)));if(r)return r}catch(e){}return demo()}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const reg=(col,id)=>db[col].find(x=>x.id===id);
function etq(col,id){const r=reg(col,id);if(!r)return '—';if(col==='indicaciones')return `${etq('pacientes',r.paciente)} · ${r.medicamento} ${r.dosis||''}`.trim();return r.codigo||r.nombre||r.titulo||'—'}

/* ============ Datos ficticios ============ */

 db.equipos.forEach(e=>{

 if(cp.length)add('baja','Capacitación','Cursos que vencen en los próximos 30 días',`${cp.length} por vencer: ${cp.slice(0,6).map(c=>etq('integrantes',c.integrante)+' ('+c.curso+')').join(', ')}${cp.length>6?'…':''}.`,'Reservar cupos de capacitación antes del vencimiento.');

 if(tv.length)add('media','Tareas','Tareas vencidas sin completar',`${tv.length} tarea(s) pendientes con plazo vencido; la más antigua venció el ${fmt(tv.map(t=>t.vence).sort()[0])}.`,'Revisar si los plazos son realistas, reasignar o cerrar las que ya no aplican.');
 const a90=db.actividades.filter(a=>a.fecha>=addDias(HOY,-89)),sp=a90.filter(a=>a.reqSeg&&!a.segDoc).length;

 if(cal!==null&&cal<90)add('baja','Registro','Calidad del registro por debajo del 90%',`${cal}% de registros completos en los últimos 30 días.`,'Identificar qué campos quedan incompletos y simplificar el formulario o reforzar el criterio.');
 const ct=A().turnos.map(t=>{const dot=db.integrantes.filter(p=>p.activo&&p.turno===t).length;return {t,r:dot?a30.filter(a=>a.turno===t).length/dot:null}}).filter(x=>x.r!==null&&x.r>0);
 if(ct.length>1){ct.sort((a,b)=>b.r-a.r);const mx=ct[0],mn=ct[ct.length-1];if(mx.r>mn.r*1.5)add('baja','Carga','Diferencia de carga entre turnos',`Turno ${mx.t}: ${mx.r.toFixed(1)} actividades por persona en 30 días; turno ${mn.t}: ${mn.r.toFixed(1)}.`,'Interpretar junto con dotación y condiciones de cada turno antes de redistribuir.')}
 db.capital.forEach(c=>{if(+c.presupuestado>0&&+c.ejecutado>+c.presupuestado)add('baja','Presupuesto','Rubro sobreejecutado',`${c.rubro} (${c.periodo}): ejecutado ${num(c.ejecutado)} sobre ${num(c.presupuestado)} presupuestado.`,'Revisar el motivo del desvío y ajustar la previsión de los próximos meses.')});

 <section class="card"><h2>Privacidad y uso justo</h2>

function campo(c,v){
 const req=c.req?' required':'',n=`name="${c.k}"`;
 if(c.t==='check')return `<label class="chk"><input type="checkbox" ${n}${v?' checked':''}> ${esc(c.l)}</label>`;
 let inp;
 if(c.t==='select')inp=`<select ${n}${req}>${opts(c.o().includes(v)||!v?c.o():c.o().concat([v]),v||c.o()[0])}</select>`;
 else if(c.t==='ref')inp=`<select ${n}${req}>${opts(db[c.col].map(r=>[r.id,etq(c.col,r.id)]),v,'— Elegir —')}</select>`;
 else inp=`<input type="${{num:'number',date:'date',month:'month',time:'time'}[c.t]||'text'}" ${n} value="${esc(v)}"${c.t==='num'?' min="0" step="any"':''}${req}>`;
 return `<label>${esc(c.l)}${inp}</label>`;
}
function abrirForm(col,id,pre){
 const sc=S[col],base={};sc.campos.forEach(c=>{if(c.d!==undefined)base[c.k]=c.d});
 const r=id?reg(col,id):Object.assign(base,pre||{}),dlg=$('#dlg');
 dlg.innerHTML=`<form method="dialog"><h2>${id?'Editar':'Agregar'} ${sc.uno}</h2>${sc.campos.map(c=>campo(c,r[c.k])).join('')}<div class="acc2"><button value="no" formnovalidate>Cancelar</button><button class="pri" value="si">Guardar</button></div></form>`;
 dlg.querySelector('form').onsubmit=e=>{
  if(!e.submitter||e.submitter.value!=='si')return;
  const fd=e.target.elements,nv=id?r:{id:uid()};
  sc.campos.forEach(c=>{const el=fd[c.k];nv[c.k]=c.t==='check'?el.checked:c.t==='num'?(el.value===''?0:+el.value):el.value.trim()});
  if(!id)db[col].push(nv);delete db.esDemo;guardar();render();
 };
 dlg.showModal();
}
function bajar(nombre,texto,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([texto],{type:tipo}));a.download=nombre;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csv(col){
 const sc=S[col],q2=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
 const txt=[sc.campos.map(c=>q2(c.c||c.l)).join(',')].concat(db[col].map(r=>sc.campos.map(c=>q2(c.t==='ref'?etq(c.col,r[c.k]):c.t==='check'?(r[c.k]?'Sí':'No'):r[c.k])).join(','))).join('\r\n');
 bajar(col+'.csv','﻿'+txt,'text/csv');
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const {act,col,id}=b.dataset;
 if(act==='tab'){tab=b.dataset.tab;render();window.scrollTo(0,0)}
 else if(act==='nuevo')abrirForm(col);
 else if(act==='editar')abrirForm(col,id);
 else if(act==='borrar'){if(confirm('¿Borrar este registro? No se puede deshacer.')){db[col]=db[col].filter(x=>x.id!==id);guardar();render()}}
 else if(act==='csv')csv(col);
 else if(act==='imprimir')window.print();
 else if(act==='dosis')abrirForm('administraciones',null,{indicacion:id,fecha:M.grano==='dia'?M.ancla:HOY,hora:new Date().toTimeString().slice(0,5),estado:'Administrada'});
 else if(act==='exportar')bajar('respaldo-tablero-'+HOY+'.json',JSON.stringify(db,null,1),'application/json');
 else if(act==='importar')$('#arch').click();
 else if(act==='demo'){if(confirm('Esto reemplaza todos los datos actuales por datos ficticios. ¿Continuar?')){db=demo();guardar();render()}}
 else if(act==='vaciar'){if(confirm('Esto borra todos los datos de este navegador y deja la herramienta en blanco. Exporta un respaldo antes si los necesitas. ¿Continuar?')){const aj=db.ajustes;db=vacio();if(!db.esDemo)db.ajustes=aj;db.ajustes.org=aj.org.includes('demo')?'Mi equipo':aj.org;guardar();render()}}
 else if(act==='copiar'){const t=$('#prompt');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(()=>document.execCommand('copy'));b.textContent='Copiada';setTimeout(()=>b.textContent='Copiar consulta',1500)}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.preset!==undefined){if(t.value){F.hasta=HOY;F.desde=addDias(HOY,-(t.value-1));render()}}
 else if(t.dataset.f){if((t.dataset.f==='desde'||t.dataset.f==='hasta')&&!t.value)return;F[t.dataset.f]=t.value;if(F.desde>F.hasta)F.hasta=F.desde;render()}
 else if(t.dataset.m){if(t.dataset.m==='ancla'&&!t.value)return;M[t.dataset.m]=t.value;render()}
 else if(t.id==='sev'){sevF=t.value;$('#hall').innerHTML=listaHall()}
 else if(t.id==='arch'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{let r=null;try{r=normal(JSON.parse(fr.result))}catch(x){}

 if(e.target.id!=='faj')return;e.preventDefault();const fd=e.target.elements,lista=v=>[...new Set(v.split(',').map(x=>x.trim()).filter(Boolean))];

/* Tooltip único: el texto se inserta con textContent */
const tip=$('#tip');
function verTip(el,x,y){
 const [t,...ls]=el.dataset.tip.split('|');tip.textContent='';
 const d=document.createElement('div');d.className='tt';d.textContent=t;tip.append(d);
 ls.forEach(l=>{const [c,v,n]=l.split('~'),r=document.createElement('div');r.className='tr';
  if(c){const i=document.createElement('i');i.style.background=c;r.append(i)}
  const b=document.createElement('b');b.textContent=v;r.append(b);if(n)r.append(document.createTextNode(n));tip.append(r)});
 tip.style.display='block';const w=tip.offsetWidth,hh=tip.offsetHeight;
 tip.style.left=Math.max(8,Math.min(x+14,innerWidth-w-8))+'px';tip.style.top=(y-hh-12<8?y+18:y-hh-12)+'px';
}
const conTip=e=>e.target.closest?e.target.closest('[data-tip]'):null;
document.addEventListener('pointermove',e=>{const el=conTip(e);if(el)verTip(el,e.clientX,e.clientY);else tip.style.display='none'});
document.addEventListener('focusin',e=>{const el=conTip(e);if(el){const r=el.getBoundingClientRect();verTip(el,r.left+r.width/2,r.top)}});
document.addEventListener('focusout',()=>tip.style.display='none');
let cw=CW();addEventListener('resize',()=>{if(CW()!==cw){cw=CW();render()}});
render();
